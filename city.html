function interact() { if (current) { for (const k in keys) keys[k] = false; window.open(current.url, '_blank', 'noopener'); } }

addEventListener('keydown', function (e) { if (!started) return; if (e.code === 'Space' || e.code.indexOf('Arrow') === 0) e.preventDefault(); if (e.repeat) return; keys[e.code] = true; if (e.code === 'KeyE') interact(); if (e.code === 'KeyR') reset(); });

  $('touch').style.display = 'grid'; $('keys').innerHTML = 'Left thumb steers &middot; Buttons on the right';

// ---------- update ----------
const qY = new THREE.Quaternion(), qP = new THREE.Quaternion(), qR = new THREE.Quaternion(), AX = new THREE.Vector3(1, 0, 0), AY = new THREE.Vector3(0, 1, 0), AZ = new THREE.Vector3(0, 0, 1);

  tA.set(0, 5.6, bk + 3).applyQuaternion(qP).applyQuaternion(qY).add(P);

  rain.uniforms.cam.value.copy(camera.position); rain.uniforms.k.value = clamp((1100 - camera.position.y) / 200, 0, 1);

      t.pos.set([s[0] - s[3] * w, s[1] - s[4] * w, s[2] - s[5] * w, s[0] + s[3] * w, s[1] + s[4] * w, s[2] + s[5] * w], i * 6);
      const c = boost ? [0.5 * f, 2.2 * f, 2.6 * f] : [2.4 * f, 0.35 * f, 1.9 * f]; t.col.set([c[0], c[1], c[2], c[0], c[1], c[2]], i * 6); }

  for (let i = 0; i < rings.length; i++) { rings[i].rotation.z += dt * (i % 2 ? -0.25 : 0.2); rings[i].rotation.x = Math.PI / 2 + Math.sin(time * 0.3 + i) * 0.12; }

  // hud
