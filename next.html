<!DOCTYPE html>
<html lang="en">
<head>

<title>Varun Vaid</title>
<meta name="description" content="A small ship, adrift somewhere quiet. Come aboard.">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>

canvas{display:block}
#hud{position:fixed;inset:0;pointer-events:none}
#dot{position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px 0 0 -2px;border-radius:50%;background:rgba(255,255,255,.7)}
#prompt{position:absolute;left:50%;bottom:18%;transform:translateX(-50%);padding:.5rem 1rem;border:1px solid rgba(255,255,255,.22);border-radius:999px;background:rgba(10,10,12,.55);font-size:.9rem;letter-spacing:.02em;opacity:0;transition:opacity .15s;white-space:nowrap}
#prompt b{display:inline-block;margin-right:.55rem;padding:0 .4rem;border:1px solid rgba(255,255,255,.5);border-radius:4px;font-weight:500;font-size:.8rem}
#msg{position:absolute;left:50%;top:14%;transform:translateX(-50%);width:90%;font-family:"Instrument Serif",Georgia,serif;font-size:clamp(1.3rem,3.4vw,1.9rem);text-align:center;opacity:0;transition:opacity .6s;text-shadow:0 1px 14px rgba(0,0,0,.9)}
#warn{position:absolute;left:50%;top:21%;transform:translateX(-50%);font-size:.85rem;letter-spacing:.2em;text-transform:uppercase;color:#ff6b4a;opacity:0;white-space:nowrap}
#stat{position:absolute;left:1.2rem;bottom:1.1rem;font-size:.74rem;line-height:1.7;letter-spacing:.07em;text-transform:uppercase;color:rgba(242,238,231,.72);white-space:pre;text-shadow:0 1px 6px rgba(0,0,0,.9)}

#flash{position:absolute;inset:0;background:#fff;opacity:0;transition:opacity .9s}
#start{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(8,8,10,.74);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);cursor:pointer;text-align:center;padding:2rem;transition:opacity .5s}
#start h1{font-family:"Instrument Serif",Georgia,serif;font-weight:400;font-size:clamp(3rem,9vw,5rem);line-height:1;margin:0 0 .7rem}
#start p{margin:0;color:rgba(242,238,231,.7);font-size:1rem}
#start .go{margin:2.2rem 0;padding:.7rem 1.5rem;border:1px solid rgba(242,238,231,.5);border-radius:999px;color:#f2eee7;font-size:.95rem;letter-spacing:.04em}

<body>
<div id="hud">
  <div id="vig"></div>

  <div id="warn"></div>
  <div id="prompt"></div>
  <div id="stat"></div>
  <div id="dmg"></div>

</div>

</div>
<div id="start">
  <h1>Varun Vaid</h1>
  <p id="sub">A small ship, adrift somewhere quiet.</p>
  <div class="go" id="go">Come aboard</div>

</div>

const nebTex = glowTex(34);

// sun
const sun = new THREE.Mesh(new THREE.SphereGeometry(7000, 48, 24), new THREE.MeshBasicMaterial({ color: 0xfff4dc }));

const sunGlow = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex(1), color: 0xffe2b0, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
sunGlow.scale.set(90000, 90000, 1); sunGlow.position.copy(sunPos); space.add(sunGlow);

    uniforms: { c: { value: new THREE.Color(color) }, sun: { value: sunDir } },
    vertexShader: 'varying vec3 vV;varying vec3 vW;void main(){vec4 wp=modelMatrix*vec4(position,1.0);vW=normalize(mat3(modelMatrix)*normal);vV=normalize(cameraPosition-wp.xyz);gl_Position=projectionMatrix*viewMatrix*wp;}',

// rocky planet
const planetTex = sphereTex(512, 256, function (x, y, z) {
  const n = fbm(x * 2.1 + 5, y * 2.1, z * 2.1, 5);
  let col;
  if (n < 0.5) col = mix3([14, 36, 84], [36, 98, 150], (n - 0.3) / 0.2);
  else col = mix3(mix3([70, 112, 62], [150, 132, 90], (n - 0.5) / 0.12), [226, 222, 214], (n - 0.66) / 0.1);

const planet = new THREE.Mesh(new THREE.SphereGeometry(1500, 96, 48), new THREE.MeshStandardMaterial({ map: planetTex, roughness: 0.9, metalness: 0 }));
planet.position.set(2600, -500, -6500); planet.rotation.z = 0.3; space.add(planet);
const pAtm = atmosphere(1545, 0x6fb0ff); pAtm.position.copy(planet.position); space.add(pAtm);
bodies.push({ n: 'Aurelia', p: planet.position, r: 1500 });
// ringed gas giant
const giantTex = sphereTex(512, 256, function (x, y, z) {
  const band = y * 10 + (fbm(x * 2.5, y * 2.5, z * 2.5, 4) - 0.5) * 2.2;
  const t = 0.5 + 0.5 * Math.sin(band);
  let col = mix3([236, 216, 178], [178, 122, 86], t);

const giant = new THREE.Group(); giant.position.set(-14000, 3000, -22000); giant.rotation.set(0.35, 0, 0.25); space.add(giant);
const giantBall = new THREE.Mesh(new THREE.SphereGeometry(3500, 96, 48), new THREE.MeshStandardMaterial({ map: giantTex, roughness: 1 })); giant.add(giantBall);

  const c = document.createElement('canvas'); c.width = 512; c.height = 4; const g = c.getContext('2d');

const beacon = new THREE.Mesh(new THREE.SphereGeometry(5, 12, 8), new THREE.MeshBasicMaterial({ color: 0xff3b2f }));
(function () {
